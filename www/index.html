<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coruja Letrada</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="homeScreen" class="screen home-screen">
    <div class="home-bg" aria-hidden="true"></div>

    <header class="home-topbar">
      <button id="parentBtn" class="icon-btn" aria-label="Área dos pais e professores">
        <svg viewBox="0 0 24 24" fill="none" class="icon">
          <path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10v9.2c0 .4.3.8.8.8H10v-5h4v5h3.2c.4 0 .8-.3.8-.8V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16.6" cy="16.6" r="3.1" fill="currentColor" opacity="0.18" stroke="none"/>
          <path d="M16.6 15.2v1.4l1 .8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="home-progress" aria-label="Progresso da trilha">
        <div class="home-progress-track"><div class="home-progress-fill" id="homeProgressFill"></div></div>
      </div>

      <button id="gardenBtn" class="icon-btn" aria-label="Jardim do Sabi">
        <svg viewBox="0 0 24 24" fill="none" class="icon">
          <path d="M12 21c-4.5 0-7.5-3.2-7.5-8.2C4.5 8 8 4.5 13 3.5c3 4 3.5 8 1.8 11.4-1 2-2.8 3.6-2.8 6.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 15.5c2.2-1 4.6-1 6.8-2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <p class="home-title">Coruja Letrada</p>

    <div class="trail-scroll" id="trailScroll">
      <div class="trail-wrap" id="trailWrap">
        <div class="mascot-dock" id="mascotDock">
          <img src="assets/images/mascot-sabi-owl.png" alt="Sabi, a coruja mascote" class="mascot-dock-img" />
        </div>
      </div>
    </div>
  </div>

  <div id="lessonScreen" class="screen lesson-screen" hidden>
    <div class="app">
      <header class="topbar">
        <button id="backToMapBtn" class="icon-btn icon-btn--onlight" aria-label="Voltar para o mapa">
          <svg viewBox="0 0 24 24" fill="none" class="icon">
            <path d="M14.5 5.5 7 12l7.5 6.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="progress-wrap">
          <span id="wordCounter" class="word-counter">Palavra 1 de 16</span>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <span class="level-badge" id="levelBadge">Nível 1</span>
      </header>

      <main class="game-area">
        <div class="mascot mascot--idle" id="mascot">
          <img src="assets/images/mascot-sabi-owl.png" class="mascot-img" alt="Sabi" />
        </div>

        <div class="word-image-wrap">
          <img class="word-image" id="wordImage" alt="" />
        </div>

        <div class="slots-row" id="slotsRow"></div>

        <div class="feedback" id="feedback"></div>

        <div class="tile-tray" id="tileTray"></div>
      </main>

      <footer class="hint">
        Arraste cada sílaba até o espaço certo!
      </footer>
    </div>
  </div>

  <div class="overlay" id="completeOverlay" hidden>
    <div class="overlay-card">
      <h2 id="completeTitle">Ilha concluída!</h2>
      <p id="completeStats"></p>
      <button id="continueBtn" class="btn primary">Continuar</button>
    </div>
  </div>

  <div class="overlay" id="parentGateOverlay" hidden>
    <div class="overlay-card">
      <h2>Área dos pais</h2>
      <p>Para continuar, resolva:</p>
      <p class="parent-question" id="parentQuestion"></p>
      <div class="parent-options" id="parentOptions"></div>
      <button class="btn secondary" id="parentCancelBtn">Cancelar</button>
    </div>
  </div>

  <div class="overlay" id="parentReportOverlay" hidden>
    <div class="overlay-card">
      <h2>Relatório</h2>
      <p id="parentReportBody"></p>
      <button class="btn primary" id="parentReportCloseBtn">Fechar</button>
    </div>
  </div>

  <div class="overlay" id="gardenOverlay" hidden>
    <div class="overlay-card">
      <h2>Jardim do Sabi</h2>
      <p id="gardenEmpty" class="garden-empty">Complete palavras para ganhar flores!</p>
      <div class="garden-grid" id="gardenGrid"></div>
      <button class="btn primary" id="gardenCloseBtn">Fechar</button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="words.js"></script>
  <script src="levels.js"></script>
  <script src="progress.js"></script>
  <script src="sfx.js"></script>
  <script src="home.js"></script>
  <script src="app.js"></script>
</body>
</html>
